<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>クーポン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;800&family=Shippori+Mincho:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css?v=3">
<style>
  body { background: var(--green-900); min-height: 100vh; padding: 16px; }
  .ticket { max-width: 420px; margin: 0 auto; background: var(--paper); border-radius: 20px; overflow: hidden; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.35); }
  .ticket-head { background: var(--green-800); color: #fff; text-align: center; padding: 18px 16px 14px; position: relative; overflow: hidden; }
  .ticket-head .brand-mark { color: var(--gold-soft); font-size: 1.2rem; }
  .ticket-head .title { font-size: 0.95rem; opacity: 0.85; }
  /* 動いている光の帯 = 今この画面が開かれている証拠（静止画の写真と見分けやすい） */
  .ticket-head::after { content: ""; position: absolute; top: 0; bottom: 0; width: 40%; left: -40%;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.18), transparent); animation: shine 2.6s linear infinite; }
  @keyframes shine { to { left: 110%; } }
  .ticket-body { padding: 22px 20px 18px; text-align: center; display: grid; gap: 10px; }
  .ball { width: 92px; height: 92px; border-radius: 50%; margin: 0 auto; display: grid; place-items: center; font-weight: 800; font-size: 1.15rem;
    box-shadow: inset -8px -10px 14px rgba(0,0,0,0.2), inset 6px 6px 10px rgba(255,255,255,0.55); border: 1px solid rgba(0,0,0,0.1); }
  .name { font-size: 1.7rem; font-weight: 800; line-height: 1.25; }
  .note { color: var(--muted); }
  .divider { border: 0; border-top: 2px dashed var(--line); margin: 6px -20px; }
  .qr-wrap { width: 62%; margin: 0 auto; }
  .code { font-size: 2rem; font-weight: 800; letter-spacing: 0.2em; }
  .exp { font-weight: 600; }
  .clock { font-variant-numeric: tabular-nums; font-size: 0.9rem; color: var(--muted); }
  .clock b { color: var(--ink); font-size: 1.1rem; }
  .show-at { background: var(--cream); border-radius: 12px; padding: 10px; font-weight: 700; }
  .once { font-size: 0.8rem; color: var(--muted); margin: 0; }
  .stamp { position: absolute; top: 44%; left: 50%; transform: translate(-50%, -50%) rotate(-14deg); border: 6px solid var(--ng); color: var(--ng);
    font-size: 2.6rem; font-weight: 800; padding: 6px 22px; border-radius: 14px; background: rgba(255,253,247,0.88); white-space: nowrap; letter-spacing: 0.1em; }
  .ticket.inactive .ticket-body > *:not(.stamp) { opacity: 0.45; }
  .ticket.inactive .ticket-head::after { display: none; }
  .center { color: #fff; text-align: center; margin-top: 30vh; }
</style>
</head>
<body>
<div id="root" class="center" data-i18n="loading"></div>

<script src="assets/js/config.js?v=3"></script>
<script src="assets/lang/ja.js?v=3"></script>
<script src="assets/lang/th.js?v=3"></script>
<script src="assets/js/i18n.js?v=3"></script>
<script src="assets/js/mock.js?v=3"></script>
<script src="assets/js/api.js?v=3"></script>
<script src="assets/js/ui.js?v=3"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script>
(() => {
  const { t, field, fmtDate, errMsg } = I18N;
  const id = (new URLSearchParams(location.search).get('c') || '').toLowerCase();
  const root = document.getElementById('root');
  let lastStatus;

  I18N.apply();
  UI.mockBadge();

  function render(c) {
    const p = c.prize;
    const inactive = c.status !== 'valid';
    root.className = '';
    root.innerHTML = `
      <article class="ticket ${inactive ? 'inactive' : ''}">
        <header class="ticket-head">
          <div class="brand-mark">${UI.esc(t('brand'))}</div>
          <div class="title">${UI.esc(t('cp_title'))}</div>
        </header>
        <div class="ticket-body">
          <div class="ball" style="background:${UI.esc(p.color)};color:${UI.inkFor(p.color)}">${UI.esc(UI.rankLabel(p.rank))}</div>
          <div class="name">${UI.esc(field(p, 'name'))}</div>
          ${field(p, 'note') ? `<div class="note">${UI.esc(field(p, 'note'))}</div>` : ''}
          <hr class="divider">
          <div class="qr-wrap">${UI.qrSvg(location.href)}</div>
          <div class="code mono">${UI.esc(c.code)}</div>
          <div class="exp">${UI.esc(t('mon_valid_until', { date: I18N.fmtExpiry(c.expires_at) }))}</div>
          ${c.redeemed_at ? `<div>${UI.esc(t('cp_used_at', { date: fmtDate(c.redeemed_at) }))}</div>` : ''}
          <div class="clock">${UI.esc(t('cp_now'))} <b id="clock"></b></div>
          <div class="show-at">${UI.esc(t('cp_show', { place: t('cafe_place') }))}</div>
          <p class="once">${UI.esc(t('cp_once'))}</p>
          ${inactive ? `<div class="stamp">${UI.esc(t('cp_stamp_' + c.status))}</div>` : ''}
        </div>
      </article>`;
    tickClock();
  }

  function tickClock() {
    const el = document.getElementById('clock');
    if (el) el.textContent = fmtDate(new Date().toISOString(), { year: undefined, month: undefined, day: undefined, second: '2-digit' });
  }

  async function load() {
    const res = await API.call('get_coupon', { p_id: id });
    if (!res.ok) {
      if (lastStatus === undefined) { root.className = 'center'; root.textContent = errMsg(res.error); }
      return;
    }
    if (res.coupon.status !== lastStatus) { lastStatus = res.coupon.status; render(res.coupon); }
  }

  load();
  setInterval(tickClock, 1000);
  setInterval(() => { if (lastStatus === 'valid') load(); }, 8000); // 喫茶店で消し込まれたらすぐ「使用済み」に変わる
})();
</script>
</body>
</html>
