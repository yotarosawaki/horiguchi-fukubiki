<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>福引クーポン</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;600;800&family=Noto+Sans+Thai:wght@400;600;800&family=Shippori+Mincho:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/common.css?v=3">
<style>
  main { max-width: 760px; margin: 0 auto; padding: 24px 16px; display: grid; gap: 16px; }
  .hero { text-align: center; padding: 12px 0; }
  .hero .brand-mark { color: var(--green-700); font-size: 1.4rem; }
  .hero h1 { margin: 4px 0; font-size: 1.6rem; }
  .links { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
  .links a { text-decoration: none; color: var(--ink); display: grid; gap: 4px; }
  .links a:hover { border-color: var(--green-500); }
  .links strong { font-size: 1.15rem; }
  .mock { background: #fff8dc; border-color: #ecd98d; }
  .mock h2 { margin: 0 0 6px; font-size: 1rem; }
  .mock p { margin: 0 0 10px; }
  .lang { display: flex; gap: 8px; align-items: center; justify-content: center; }
</style>
</head>
<body>
<main>
  <div class="hero">
    <div class="brand-mark" data-i18n="brand"></div>
    <h1 data-i18n="idx_title"></h1>
    <div class="muted" data-i18n="event_name"></div>
  </div>

  <div class="card mock hidden" id="mock">
    <h2 data-i18n="idx_mock_title"></h2>
    <p data-i18n="idx_mock_body"></p>
    <p class="small mono" id="mock-pins"></p>
    <button class="btn btn-sm" id="mock-reset" data-i18n="idx_mock_reset"></button>
  </div>

  <nav class="links">
    <a class="card" data-href="monitor.html" target="_blank"><strong data-i18n="idx_monitor"></strong><span class="muted small" data-i18n="idx_monitor_d"></span></a>
    <a class="card" data-href="staff.html" target="_blank"><strong data-i18n="idx_staff"></strong><span class="muted small" data-i18n="idx_staff_d"></span></a>
    <a class="card" data-href="cafe.html" target="_blank"><strong data-i18n="idx_cafe"></strong><span class="muted small" data-i18n="idx_cafe_d"></span></a>
    <a class="card" data-href="admin.html" target="_blank"><strong data-i18n="idx_admin"></strong><span class="muted small" data-i18n="idx_admin_d"></span></a>
  </nav>

  <div class="lang small">
    <span data-i18n="idx_lang"></span>
    <a class="btn btn-sm" href="?lang=ja">日本語</a>
    <a class="btn btn-sm" href="?lang=th">ไทย</a>
  </div>
</main>

<script src="assets/js/config.js?v=3"></script>
<script src="assets/lang/ja.js?v=3"></script>
<script src="assets/lang/th.js?v=3"></script>
<script src="assets/js/i18n.js?v=3"></script>
<script src="assets/js/mock.js?v=3"></script>
<script src="assets/js/api.js?v=3"></script>
<script src="assets/js/ui.js?v=3"></script>
<script>
  I18N.apply();
  // 言語・試用モードの指定を各画面に引き継ぐ
  const keep = new URLSearchParams();
  const cur = new URLSearchParams(location.search);
  ['lang', 'backend'].forEach((k) => { if (cur.get(k)) keep.set(k, cur.get(k)); });
  document.querySelectorAll('a[data-href]').forEach((a) => { a.href = a.dataset.href + (keep.toString() ? '?' + keep : ''); });
  if (API.mode === 'mock') {
    document.getElementById('mock').classList.remove('hidden');
    const P = MockBackend.PINS;
    document.getElementById('mock-pins').textContent = `PIN — staff: ${P.staff} / cafe: ${P.cafe} / admin: ${P.admin}`;
    document.getElementById('mock-reset').addEventListener('click', () => {
      MockBackend.reset();
      ['staff', 'cafe', 'admin'].forEach(UI.forgetPin);
      location.reload();
    });
  }
</script>
</body>
</html>
